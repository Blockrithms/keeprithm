services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: slack-exporter-backend
    ports:
      - '${SERVER_PORT}:3000'
    env_file:
      - ./server/.env.production
    networks:
      - app-network
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: slack-exporter-frontend
    ports:
      - '${CLIENT_PORT}:4000'
    env_file:
      - ./client/.env.production
    networks:
      - app-network
    restart: unless-stopped

  mongo:
    image: mongo:8.0.4
    container_name: slack-exporter-mongo
    ports:
      - '${DATABASE_PORT}:27017'
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DATABASE_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - app-network
    volumes:
      - mongo_data:/data/db

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data:
